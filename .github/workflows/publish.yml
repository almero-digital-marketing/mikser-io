# Publish to npm without a stored token.
#
# npm is retiring tokens that skip the second factor — its own token page says
# "Publish new versions directly (deprecated — ends January 2027)" — and the
# replacement is this: the job proves who it is at the moment it publishes,
# using a short-lived credential GitHub issues and npm verifies. npm trusts
# "the publish.yml workflow in this repository", not a string.
#
# So there is no NODE_AUTH_TOKEN here and no secret to configure. That is the
# point: nothing to leak, nothing to expire, nothing to rotate. The two ways
# publishing broke in September 2026 — a token that died silently and a token
# pasted into a chat window — are both absent by construction.
#
# The npm side has to be linked once, per package: npmjs.com → the package →
# Settings → Trusted Publisher → GitHub Actions, naming this repository and
# this filename. Until that link exists the publish step fails, which is the
# correct behaviour rather than a silent fallback to something weaker.

name: Publish

on:
  push:
    tags: ['v*']
  # So a failed release can be retried without inventing a tag.
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The whole mechanism. Without it npm has nothing to verify and the
      # publish falls back to looking for a token that is not there.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing landed in npm 11.5.1. setup-node ships whatever npm
      # came with the node build, so pin it forward rather than hope.
      - name: Use an npm that can do trusted publishing
        run: npm install -g npm@latest

      # `npm install`, not `npm ci`, and that is about this repo's shape rather
      # than a shortcut. These packages are developed inside a workspace —
      # /home/.../mikser/package.json declares workspaces ["mikser-io",
      # "mikser-io-*"] — so dependencies hoist to the workspace root and each
      # package's own package-lock.json is never read by anyone locally. They
      # rot silently: mikser-io's had no top-level knex at all while
      # package.json declared it, and pinned mime-types two majors back.
      #
      # CI checks out one repository standalone, so it is the only thing that
      # would ever read them. `npm ci` would therefore fail on drift nobody can
      # see and nobody has a reason to fix, forty times over.
      - run: npm install --no-audit --no-fund
        env:
          # puppeteer downloads a browser on install. Nothing in the release
          # path renders a page — the smoke test that would is deliberately
          # not run here — so this is a slow, network-dependent step whose
          # only contribution is a way to fail.
          PUPPETEER_SKIP_DOWNLOAD: '1'

      # The tag is the release. A tag that disagrees with package.json would
      # publish a version nobody asked for, under a name that says otherwise —
      # so it stops here instead.
      - name: Tag must match package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG does not match package.json $PKG"
            exit 1
          fi
          echo "publishing $PKG"

      # Unit tests only, and the reason is the workspace again rather than
      # laziness.
      #
      # test:scenarios spawns real builds whose configs import sibling packages
      # — mikser-io-layouts, mikser-io-render-liquid — and its harness reaches
      # them by setting NODE_PATH to the PARENT directory of this checkout.
      # That is the workspace root on a development machine and nothing at all
      # in CI, where this repository is cloned on its own. Every scenario fails
      # there for the same uninteresting reason.
      #
      # test:smoke is out for a different reason: it builds test/fixture and
      # reports coded faults for what a CI box lacks — no chrome for the pdf
      # postprocessor, no OpenAI key for the vector plugin — and a fault exits
      # non-zero. Those are environment facts, and failing releases on them
      # teaches people to ignore red runs.
      #
      # So 899 unit tests gate the release here, and the scenario suite stays
      # what it already is: the thing you run in the workspace before tagging.
      - run: npm run test:unit

      # `--tag latest` explicitly, not by implication.
      #
      # npm applies `latest` implicitly only when the new version is the
      # HIGHEST published, and refuses the publish outright otherwise:
      # "Cannot implicitly apply the latest tag because previously published
      # version X is higher". A 11.0.0 went out and was walked back to a 10.x
      # line, which stranded every subsequent 10.x release behind that refusal
      # — the releases were correct and unpublishable.
      #
      # Saying it outright is what the implicit rule does on an ordinary
      # release anyway, so nothing changes for the normal case, and a line
      # that continues after a version is withdrawn is worth more than a
      # default that assumes it never happens.
      - run: npm publish --access public --tag latest
