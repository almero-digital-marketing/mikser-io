backend:
  name: proxy
  proxy_url: http://localhost:3001/decap/api/v1
  branch: main

media_folder: files
public_folder: /files

collections:
  - name: documents
    label: Documents
    folder: documents/en
    create: true
    extension: md
    format: frontmatter
    fields:
      - { name: title,  label: Title,  widget: string }
      - { name: layout, label: Layout, widget: string }
      - { name: lang,   label: Lang,   widget: string, default: en }
      - { name: date,   label: Date,   widget: datetime, required: false }
      - { name: body,   label: Body,   widget: markdown }
